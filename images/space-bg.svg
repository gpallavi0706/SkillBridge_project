<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="nebulaCyan" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#4facfe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070b19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b92b27" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#8a2387" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#3b0764" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070b19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaViolet" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#4338ca" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070b19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPink" cx="65%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070b19" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Base -->
  <rect width="1920" height="1080" fill="#050814"/>

  <!-- Nebulae Clouds -->
  <rect width="1920" height="1080" fill="url(#nebulaCyan)"/>
  <rect width="1920" height="1080" fill="url(#nebulaPurple)"/>
  <rect width="1920" height="1080" fill="url(#nebulaViolet)"/>
  <rect width="1920" height="1080" fill="url(#nebulaPink)"/>

  <!-- Stars Field (Small & Distant) -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1"/>
    <circle cx="340" cy="190" r="1.5"/>
    <circle cx="560" cy="90" r="1"/>
    <circle cx="780" cy="220" r="1.2"/>
    <circle cx="920" cy="70" r="1"/>
    <circle cx="1140" cy="180" r="1.5"/>
    <circle cx="1380" cy="110" r="1"/>
    <circle cx="1600" cy="240" r="1.8"/>
    <circle cx="1780" cy="85" r="1"/>
    <circle cx="210" cy="380" r="1.5"/>
    <circle cx="450" cy="420" r="1"/>
    <circle cx="680" cy="350" r="1.2"/>
    <circle cx="890" cy="460" r="1"/>
    <circle cx="1080" cy="390" r="1.8"/>
    <circle cx="1320" cy="440" r="1.2"/>
    <circle cx="1540" cy="370" r="1"/>
    <circle cx="1720" cy="460" r="1.5"/>
    <circle cx="1850" cy="320" r="1"/>
    <circle cx="150" cy="650" r="1.2"/>
    <circle cx="380" cy="720" r="1.5"/>
    <circle cx="620" cy="610" r="1"/>
    <circle cx="840" cy="740" r="1.6"/>
    <circle cx="1020" cy="670" r="1.2"/>
    <circle cx="1250" cy="710" r="1"/>
    <circle cx="1480" cy="640" r="1.5"/>
    <circle cx="1690" cy="730" r="1.2"/>
    <circle cx="1870" cy="620" r="1"/>
    <circle cx="240" cy="920" r="1.5"/>
    <circle cx="490" cy="880" r="1"/>
    <circle cx="720" cy="950" r="1.4"/>
    <circle cx="950" cy="890" r="1"/>
    <circle cx="1180" cy="940" r="1.8"/>
    <circle cx="1410" cy="870" r="1"/>
    <circle cx="1640" cy="960" r="1.5"/>
    <circle cx="1820" cy="910" r="1"/>
  </g>

  <!-- Glowing Bright Stars & Constellations -->
  <g fill="#e0f2fe" filter="url(#glow)">
    <circle cx="280" cy="140" r="2.5" fill="#38bdf8"/>
    <circle cx="420" cy="260" r="2" fill="#ffffff"/>
    <circle cx="740" cy="160" r="3" fill="#a78bfa"/>
    <circle cx="1240" cy="220" r="2.8" fill="#38bdf8"/>
    <circle cx="1490" cy="180" r="3.2" fill="#ec4899"/>
    <circle cx="1680" cy="290" r="2.2" fill="#ffffff"/>
    <circle cx="310" cy="540" r="2.6" fill="#67e8f9"/>
    <circle cx="820" cy="580" r="3.5" fill="#c084fc"/>
    <circle cx="1150" cy="520" r="2.8" fill="#60a5fa"/>
    <circle cx="1580" cy="560" r="3" fill="#f472b6"/>
    <circle cx="450" cy="820" r="2.4" fill="#38bdf8"/>
    <circle cx="880" cy="840" r="3" fill="#ffffff"/>
    <circle cx="1340" cy="810" r="3.2" fill="#a855f7"/>
    <circle cx="1740" cy="850" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Primary Major Celestial Body / Pulsar -->
  <circle cx="1490" cy="180" r="6" fill="#f43f5e" filter="url(#bigGlow)" opacity="0.8"/>
  <circle cx="740" cy="160" r="5" fill="#818cf8" filter="url(#bigGlow)" opacity="0.85"/>
  <circle cx="310" cy="540" r="5" fill="#38bdf8" filter="url(#bigGlow)" opacity="0.85"/>
  <circle cx="1340" cy="810" r="5.5" fill="#c084fc" filter="url(#bigGlow)" opacity="0.8"/>

  <!-- Stardust Dust Streaks -->
  <path d="M100 200 Q 500 120 900 350 T 1700 300" stroke="rgba(56, 189, 248, 0.08)" stroke-width="40" fill="none" filter="url(#bigGlow)"/>
  <path d="M200 800 Q 700 650 1200 780 T 1800 680" stroke="rgba(168, 85, 247, 0.08)" stroke-width="60" fill="none" filter="url(#bigGlow)"/>
</svg>
