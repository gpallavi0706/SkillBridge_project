<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky Base Linear Gradient -->
    <linearGradient id="morningSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67baf5"/>
      <stop offset="25%" stop-color="#91d2fa"/>
      <stop offset="55%" stop-color="#bae6fd"/>
      <stop offset="80%" stop-color="#dcf0fc"/>
      <stop offset="100%" stop-color="#f5faff"/>
    </linearGradient>

    <!-- Morning Sun Glow -->
    <radialGradient id="sunGlow" cx="20%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#fef08a" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#fed7aa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Sky Light -->
    <radialGradient id="ambientLight" cx="82%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#c7e8fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#91d2fa" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Cloud Filter -->
    <filter id="softCloud" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#morningSkyGrad)"/>

  <!-- Sun Radiance -->
  <rect width="1920" height="1080" fill="url(#sunGlow)"/>
  <rect width="1920" height="1080" fill="url(#ambientLight)"/>

  <!-- Morning Clouds (Soft Ambient Layers) -->
  <g opacity="0.35" filter="url(#softCloud)">
    <ellipse cx="320" cy="190" rx="260" ry="50" fill="#ffffff"/>
    <ellipse cx="460" cy="180" rx="190" ry="60" fill="#ffffff"/>
    <ellipse cx="1480" cy="240" rx="320" ry="55" fill="#ffffff"/>
    <ellipse cx="1620" cy="225" rx="220" ry="65" fill="#ffffff"/>
    <ellipse cx="980" cy="140" rx="280" ry="45" fill="#ffffff"/>
    <ellipse cx="780" cy="310" rx="340" ry="60" fill="#ffffff"/>
    <ellipse cx="1200" cy="380" rx="260" ry="50" fill="#ffffff"/>
  </g>
</svg>
